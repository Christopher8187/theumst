<script>
const nodes=[
{id:101,title:'Partitions',short:'Partitions',type:'definition',section:'7.1',text:'A partition divides an interval into finitely many adjacent pieces.',work:'Choose ordered points a = x₀ < x₁ < … < xₙ = b. The largest interval width measures the fineness of the partition.',eq:'P = { x₀, x₁, …, xₙ }'},
{id:102,title:'Step functions',short:'Step functions',type:'example',section:'7.1',text:'A step function is constant on each piece of a finite partition.',work:'The area is the sum of rectangle heights multiplied by widths. This supplies a first concrete model of an integral.',eq:'Area = Σ height × width'},
{id:103,title:'Upper and lower sums',short:'Upper / lower sums',type:'definition',section:'7.2',text:'On each subinterval, use the supremum or infimum of a bounded function to form upper and lower sums.',work:'Both sums depend on the partition. Refining it improves the lower approximation and the upper approximation.',eq:'L(f, P) ≤ U(f, P)'},
{id:104,title:'Refinement lemma',short:'Refinement lemma',type:'theorem',section:'7.2',text:'Refining a partition raises the lower sum and lowers the upper sum.',work:'Compare each original interval with its smaller pieces. Their infima cannot become smaller than the original infimum, and their suprema cannot become larger.',eq:'L(f, P) ≤ L(f, P′) ≤ U(f, P′) ≤ U(f, P)'},
{id:105,title:'Continuous functions',short:'Continuous functions',type:'context',section:'7.3',text:'A continuous function on a closed bounded interval is uniformly continuous.',work:'This sample reviews the uniform estimate needed for sufficiently small partition intervals.',eq:'|x − y| < δ ⇒ |f(x) − f(y)| < ε'},
{id:106,title:'Integrability criterion',short:'Integrability criterion',type:'theorem',section:'7.3',text:'A bounded function is Riemann integrable if its upper and lower sums can be made arbitrarily close.',work:'Choose a partition for each positive tolerance. Common refinements let the two families of sums approach the same value.',eq:'∀ ε > 0, ∃ P : U(f, P) − L(f, P) < ε'},
{id:107,title:'Continuous implies integrable',short:'Continuity → integral',type:'theorem',section:'7.3',text:'Every continuous function on a closed bounded interval is Riemann integrable.',work:'Uniform continuity controls the oscillation on small intervals. Sum the resulting bounds and apply the integrability criterion.',eq:'U(f, P) − L(f, P) < ε(b − a)'},
{id:108,title:'Integrate a quadratic',short:'Integrate a quadratic',type:'exercise',section:'7.4',text:'Use a regular partition to calculate the integral of x² from 0 to 1.',work:'Express the upper sum using the sum of the first n squares. Let n grow and compare the lower sum.',eq:'∫₀¹ x² dx = 1/3'},
{id:109,title:'An oscillating example',short:'Oscillating example',type:'exercise',section:'7.4',text:'Compare the upper and lower sums of a function equal to one on rational points and zero otherwise.',work:'Every nonempty interval contains both rational and irrational points. Its upper and lower values therefore remain separated.',eq:'U(f, P) − L(f, P) = b − a'}
];
// Directed fixture pairs mean target uses source. They are presentation-scoped dependencies,
// never inferred from the visual coordinates or from adjacent positions in the book.
const dependencies=[[101,102],[101,103],[103,104],[104,106],[105,107],[106,107],[102,108],[107,108],[103,109]];
const sourceOrder=[[101,102],[102,103],[103,104],[104,105],[105,106],[106,107],[107,108],[108,109]];
const otherObject={id:208,title:'A convergent subsequence',short:'A convergent subsequence',type:'exercise',section:'3.2',text:'Find a constant subsequence in the alternating sequence 1, −1, 1, −1, …',work:'Choose all the odd terms. Each selected term equals one.',eq:'a₂ₙ₊₁ = 1'};
const byId=id=>nodes.find(n=>n.id===Number(id))||(Number(id)===208?otherObject:undefined);
const params=new URLSearchParams(location.search);let variant=['A','B','C'].includes(params.get('variant'))?params.get('variant'):'A';
const scenario=params.get('scenario')||'navigation';
let s={selected:106,focus:106,peek:106,goal:108,done:new Set([101,102,103]),history:[],order:scenario==='model',side:scenario==='notes'?'notes':'graph',page:'reader',base:'A',origin:'A',hidden:new Set(),modal:null,expanded:false,message:'Choose a graph node, or start the guided comparison.',note:1,notes:[{id:1,name:'Intuition',body:'The gap between upper and lower sums is what matters.'},{id:2,name:'Example',body:'Try equal partitions before comparing a refinement.'}],draft:'The gap between upper and lower sums is what matters.',dirty:false,pending:null};
const esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const button=(label,action,value='',cls='')=>`<button class="${cls}" data-action="${action}" data-value="${value}">${label}</button>`;
function ancestors(id){const result=new Set([id]);let count;do{count=result.size;dependencies.forEach(([a,b])=>{if(result.has(b))result.add(a)})}while(count!==result.size);return result}
function direct(id){return new Set([id,...dependencies.filter(([a,b])=>a===id||b===id).flat()])}
function openNode(id){id=Number(id);if(s.hidden.has(s.base))return;if(id!==s.selected)s.history.push(s.selected);s.selected=id;s.peek=id;s.focus=id;s.side='graph';s.message=byId(id).title+' is now open in Text. Completion has not changed.'}
const names={A:'Real Analysis',C:'Mathematical Examples'};
const variantNames={A:'Atlas',B:'Focus',C:'Destination'};
function renderNode(id,x,y,{circle=false,dim=false}={}){const n=byId(id),selected=s.selected===id,done=s.done.has(id);let words=n.short.split(' '),lines=n.short.length>19?[words.slice(0,Math.ceil(words.length/2)).join(' '),words.slice(Math.ceil(words.length/2)).join(' ')]:[n.short];return `<g class="node ${selected?'active ':''}${done?'done ':''}${dim?'dim':''}" role="button" tabindex="0" aria-label="${esc(n.title)}${selected?', currently reading':''}${done?', completed':''}" data-action="node" data-value="${id}" transform="translate(${x} ${y})"><title>${esc(n.title)} · ${n.type} · ${n.section}</title>${circle?'<circle class="face" r="49"/>':'<rect x="-68" y="-28" width="136" height="56" rx="10"/>'}<text class="num" x="${circle?-25:-55}" y="${circle?-26:-15}">${n.section}</text>${done?`<text class="tick" x="${circle?22:48}" y="${circle?-25:-14}">✓</text>`:''}${lines.map((t,i)=>`<text class="name" text-anchor="middle" y="${i*13+(lines.length===1?3:-3)}">${esc(t)}</text>`).join('')}<text class="type" text-anchor="middle" y="${circle?30:21}">${n.type}</text></g>`}
function svgStart(){return '<svg viewBox="0 0 560 440" aria-label="Interactive knowledge graph"><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#8abab1"/></marker><marker id="goldarrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#e9c48a"/></marker><filter id="glow" x="-30%" y="-60%" width="160%" height="220%"><feGaussianBlur stdDeviation="5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>'}
function edge(a,b,pos,kind='',horizontal=false){if(!pos[a]||!pos[b])return '';const [x,y]=pos[a],[u,v]=pos[b];let d;if(horizontal){const dir=u>=x?1:-1,start=x+dir*49,end=u-dir*49;d=`M${start} ${y} C${(start+end)/2} ${y},${(start+end)/2} ${v},${end} ${v}`;}else if(a===102&&b===108){const lane=v-49;d=`M${x} ${y+29} L${x} ${lane-16} Q${x} ${lane} ${x+16} ${lane} H${u-16} Q${u} ${lane} ${u} ${v-32}`}else if(a===103&&b===109){d=`M${x} ${y+29} C${x} ${y+67},28 ${y+35},28 ${y+80} L28 ${v-53} Q28 ${v-34} ${u} ${v-34} L${u} ${v-32}`}else if(Math.abs(v-y)<3){const dir=u>=x?1:-1;d=`M${x+dir*69} ${y} L${u-dir*72} ${v}`}else{const down=v>=y,start=y+(down?29:-29),end=v+(down?-32:32);d=`M${x} ${start} C${x} ${(start+end)/2},${u} ${(start+end)/2},${u} ${end}`}return `<path class="edge ${kind}" d="${d}"><title>${esc(byId(a).title)} → ${esc(byId(b).title)} · ${kind.includes('order')?'next in source':s.order&&sourceOrder.some(([c,d])=>a===c&&b===d)?'dependency + next in source':'dependency'}</title></path>`}
function atlas(){const pos={101:[138,47],102:[85,135],103:[245,135],104:[245,223],105:[433,223],106:[245,311],107:[433,311],108:[433,404],109:[85,404]},near=direct(s.selected);return '<div class="graphstage">'+svgStart()+[80,178,267,355].map(y=>`<path d="M22 ${y}H538" stroke="#567b7820"/>`).join('')+dependencies.map(([a,b])=>edge(a,b,pos,near.has(a)&&near.has(b)?'highlight':'')).join('')+(s.order?sourceOrder.filter(([a,b])=>!dependencies.some(([c,d])=>a===c&&b===d)).map(([a,b])=>edge(a,b,pos,'order')).join(''):'')+nodes.map(n=>renderNode(n.id,...pos[n.id])).join('')+'</svg></div>'}
function focus(){const pre=dependencies.filter(([a,b])=>b===s.focus).map(([a])=>a),post=dependencies.filter(([a,b])=>a===s.focus).map(([,b])=>b),pos={[s.focus]:[280,220]};pre.forEach((id,i)=>pos[id]=[92,pre.length===1?220:120+i*180]);post.forEach((id,i)=>pos[id]=[468,post.length===1?220:120+i*180]);let inner=svgStart()+'<circle class="halo" cx="280" cy="220" r="94"/><circle class="halo" cx="280" cy="220" r="169"/><path class="halo" d="M16 220H544M280 25V415"/>'+dependencies.map(([a,b])=>edge(a,b,pos,'highlight',true)).join('')+(s.order?sourceOrder.filter(([a,b])=>!dependencies.some(([c,d])=>a===c&&b===d)).map(([a,b])=>edge(a,b,pos,'order',true)).join(''):'')+Object.entries(pos).map(([id,p])=>renderNode(Number(id),...p,{circle:true})).join('')+'</svg>';return '<div class="graphstage"><div class="lens-heading"><span>Used by this object</span><span>Uses this object</span></div>'+inner+'</div><div class="inspector"><div><p>Selected in the graph</p><strong>'+byId(s.peek).title+'</strong><p>'+byId(s.peek).type+' · section '+byId(s.peek).section+' · '+(s.peek===s.selected?'Already open in Text':'Text remains on '+byId(s.selected).title)+'</p></div>'+button('Read this object →','open',s.peek,'primary')+'</div>'}
function destination(){const needed=ancestors(s.goal),remaining=[...needed].filter(id=>!s.done.has(id));const pos={101:[110,45],102:[90,140],103:[280,140],104:[280,228],105:[460,228],106:[280,316],107:[460,316],108:[460,407],109:[90,407]};return '<div class="goalbar"><label for="goal">Destination</label><select id="goal" data-change="goal"><option value="108"'+(s.goal===108?' selected':'')+'>Integrate a quadratic</option><option value="109"'+(s.goal===109?' selected':'')+'>An oscillating example</option><option value="107"'+(s.goal===107?' selected':'')+'>Continuous implies integrable</option></select></div><p class="trail-stats"><b>'+remaining.length+' unfinished objects</b> across all dependency branches · '+[...needed].filter(id=>s.done.has(id)).length+' completed</p><div class="graphstage">'+svgStart()+dependencies.map(([a,b])=>edge(a,b,pos,needed.has(a)&&needed.has(b)?'highlight':'dim')).join('')+(s.order?sourceOrder.filter(([a,b])=>!dependencies.some(([c,d])=>a===c&&b===d)).map(([a,b])=>edge(a,b,pos,'order')).join(''):'')+nodes.map(n=>renderNode(n.id,...pos[n.id],{dim:!needed.has(n.id)})).join('')+'</svg></div><div class="inspector"><div><p>Next suggested object</p><strong>'+(remaining.length?byId(remaining.sort((a,b)=>a-b)[0]).title:'Destination completed')+'</strong><p>All branches stay available. This is a suggestion.</p></div>'+button(remaining.length?'Continue route →':'Review destination','open',remaining.length?remaining[0]:s.goal,'primary')+'</div>'}
function graph(){if(s.base==='C'&&!s.hidden.has(s.base))return '<div class="graphhead"><div><span class="label">Available base grimoire</span><h2>Mathematical Examples</h2><p>Your current object remains available.</p></div></div><div class="graphstage">'+svgStart()+renderNode(208,280,220,{circle:true})+'</svg></div><div class="graphfoot"><p>Object 208 · Section 3.2</p>'+button(s.done.has(208)?'✓ Completed':'○ Mark done','done',208)+'</div>';if(s.hidden.has(s.base))return '<div class="empty">Source unavailable. No knowledge objects are displayed.</div>';const descriptions={A:'The whole map stays fixed as you move through it.',B:'Inspect one relation at a time, then open what interests you.',C:'Choose a destination. See every dependency branch leading to it.'};return '<div class="graphhead"><div><span class="label">'+variantNames[variant]+' / dependencies</span><h2>'+(variant==='A'?'See the whole chapter':variant==='B'?'Around this idea':'A route to your destination')+'</h2><p>'+descriptions[variant]+'</p></div>'+button('Contents','contents')+'</div><div class="legend"><span><i class="line"></i>Dependency →</span><span><i class="dot"></i>Completed ✓</span><span><i class="dot gold"></i>Section</span>'+(s.order?'<span><i class="line dashed"></i>Source order → · shared solid edges identify both in their tooltip</span>':'')+'</div>'+(variant==='A'?atlas():variant==='B'?focus():destination())+'<div class="graphfoot"><p>'+s.done.size+' of 9 complete · Reading '+byId(s.selected).short+'</p>'+button(s.done.has(s.selected)?'✓ Completed':'○ Mark done','done',s.selected,s.done.has(s.selected)?'primary':'')+'</div>'}
function notes(){return '<div class="notes"><span class="label">Your personal writing</span><h3>Notes</h3><label>Attached note<select data-change="note">'+s.notes.map(n=>'<option value="'+n.id+'"'+(s.note===n.id?' selected':'')+'>'+esc(n.name)+'</option>').join('')+(!s.notes.some(n=>n.id===s.note)?'<option selected value="'+s.note+'">New note</option>':'')+'</select></label>'+button('+ New note','newNote')+'<label>Your writing<textarea id="writing">'+esc(s.draft)+'</textarea></label><small id="dirty">'+(s.dirty?'Unsaved changes':'Saved in this demo only')+'</small><div class="actions">'+button('Save note','saveNote','','primary')+button('Back to graph','closeNotes')+'</div><p class="small" style="margin-top:20px">'+(s.hidden.has(s.base)?'Source unavailable. Your writing remains available.':'Attached to Integrability criterion')+'</p></div>'}
function contents(){return '<div class="contents"><span class="label">Source structure</span><h2>Contents</h2>'+button('▾ 7 · Integration','open',101)+button('7.1 · Partitions and step functions','open',101,'child')+button('7.2 · Upper and lower sums','open',103,'child')+button('7.3 · Integrability','open',106,'child')+button('7.4 · Exercises','open',108,'child')+button('Back to graph','closeNotes')+'<p class="small">Section links follow the book. Graph arrows describe dependencies between objects.</p></div>'}
function reader(){if(s.hidden.has(s.base))return '<article class="reader"><span class="label">Text realm</span><h2>Grimoire unavailable</h2><p class="workings">Its source content is withheld. Your progress and personal writing are retained.</p></article>';const n=byId(s.selected);return '<article class="reader"><div class="object-meta"><span class="pill">'+n.type+'</span><small>Object '+n.id+' · '+n.section+'</small></div><h2>'+n.title+'</h2><section><h3>Statement</h3><p class="statement">'+n.text+'</p><div class="equation">'+n.eq+'</div></section><section><h3>Workings</h3><p class="workings">'+n.work+'</p></section><div class="actions">'+button('↗ Project','info','Projection is outside this navigation comparison.')+button('✎ Notes','notes')+button('✦ Find neighbors','info','Discovery remains a separate action from dependency navigation.')+button('→ Train','train')+'</div></article>'}
function availabilityControls(){return '<div class="demo-note"><h3>Q23 · Agreed unavailable-grimoire behavior</h3><p>Base grimoire means the grimoire on the page. The original grimoire is the starting point of an excursion.</p><div class="actions">'+button('Start in original grimoire','case','original')+button('Explore another grimoire','case','other')+button('Make original unavailable','hide')+'</div><p>Try both starting states. Content disappears immediately when the base becomes unavailable. The agreed exit destination is My grimoires.</p></div>'}
function render(){const baseUnavailable=s.hidden.has(s.base);document.getElementById('app').innerHTML='<div class="app"><aside class="rail">'+button('←','back')+'<span class="logo">UMST</span>'+button('書','reader','','active')+button('寫','notes')+'</aside><div><div class="top"><span>Language: English</span><span>Web Demo · navigation prototype</span></div><header class="bookbar"><div><span class="label">'+(s.page==='library'?'Personal collection':'Text realm / base grimoire')+'</span><h2>'+(s.page==='library'?'My grimoires':baseUnavailable?'Unavailable grimoire':names[s.base])+'</h2></div>'+(s.page==='reader'&&!baseUnavailable?'<div class="crumbs">'+(s.base==='C'?'<span>3 · Sequences › 3.2 · Subsequences</span>':button('7 · Integration','open',101)+'<span>›</span>'+button(byId(s.selected).section+' · '+(byId(s.selected).section==='7.3'?'Integrability':'Section'),'open',byId(s.selected).section==='7.3'?106:byId(s.selected).section==='7.2'?103:byId(s.selected).section==='7.4'?108:101)+button('Contents','contents'))+'</div>':'')+'</header>'+(s.page==='library'?'<section class="booklist"><h2>Your next place to read</h2><p>You have left the reader. Saved positions and completion remain.</p><article><span class="label">Available grimoire</span><h2>Mathematical Examples</h2><p>Reopen this available grimoire from your collection.</p>'+button('Open Text','openAvailable','','primary')+'</article></section>':'<div class="split">'+reader()+'<aside class="graphpanel" aria-label="Right-hand study panel">'+(s.side==='notes'?notes():s.side==='contents'?contents():graph())+'</aside></div>')+'</div></div>';
document.getElementById('status').textContent=s.message;
document.getElementById('below').innerHTML=(scenario==='availability'?availabilityControls():scenario==='notes'?'<div class="demo-note"><h3>Q25 · Switching with unfinished writing</h3><p>Edit Intuition, then choose Example, New note, or Back to graph. Try Save and continue, Discard and continue, and Keep editing. The pending destination is preserved.</p><p>This note-protection behavior is accepted. Saving has no effect outside this tab.</p>'+button('Insert an unsaved example','draft')+'</div>':'<div class="demo-note"><h3>Try the navigation</h3><p>'+(variant==='A'?'Open the Refinement lemma in the fixed map, then return using the reader’s back arrow. Mark the current object done and watch its node.':variant==='B'?'Select Refinement lemma on the left of the focus. The reader stays put while you inspect it. Press Read this object to move and recenter.':'Choose An oscillating example as your destination. Its ancestor branch lights up while unrelated objects fade. Continue route opens the next unfinished object.')+'</p><div class="actions">'+button('Start guided example','guide','','primary')+button('Reset this prototype','reset')+'</div><p>All three variants use the same nine objects and nine assumed dependency relations. Switch variants at the bottom to compare.</p></div>')+'<div class="model" id="model"><h3>Q26 · What the graph displays</h3><p class="formula">G = (V, E), &nbsp; A → B means B uses A</p><p>Each node is a source-specific knowledge object. More than one incoming dependency is allowed. Completion is a node state, separate from navigation.</p><label><input type="checkbox" id="order"'+(s.order?' checked':'')+'> Also show source order as dotted gold arrows</label><p>For example, Step functions appears before Upper and lower sums, but that order alone does not make it a dependency. Coincident edges use one solid arrow whose tooltip identifies both meanings.</p><p class="small">This is an assumed dependency view for later Inner grimoire graph design. Raw dependencies may contain cycles. The Inner grimoire graph remains a DAG of recommended study progression, with strict prerequisites marked separately. The later graph prototype owns that transformation; this sample has no cycles.</p></div>';
document.getElementById('switcher').innerHTML=button('‹','variant','previous')+['A','B','C'].map(v=>'<a class="'+(variant===v?'active':'')+'" href="?variant='+v+(scenario!=='navigation'?'&scenario='+scenario:'')+'" data-variant="'+v+'">'+v+' · '+variantNames[v]+'</a>').join('')+button('›','variant','next');renderDialog()}
function renderDialog(){const root=document.getElementById('dialog');if(!s.modal){root.innerHTML='';return}let title,body,actions;if(s.modal==='unsaved'){title='Keep your changes?';body='You have unfinished writing in this note. Choose what to do before continuing.';actions=button('Save and continue','resolveNote','save','primary')+button('Discard and continue','resolveNote','discard')+button('Keep editing','resolveNote','cancel')}else{const isBase=s.hidden.has(s.base);title=isBase?'This grimoire is unavailable':'The original grimoire is unavailable';body=isBase?'The grimoire on this page can no longer be read. Your writing and saved progress are retained. Confirm to leave the reader.':'Your original grimoire is unavailable. Confirm to leave the reader, or stay in '+names[s.base]+', your available base grimoire.';actions=button('Confirm and exit','exit','','primary')+(!isBase?button('Stay in this base grimoire','stay'):'')}root.innerHTML='<div class="modalback"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="dialogTitle"><span class="label">'+(s.modal==='unsaved'?'Personal writing':'Availability changed')+'</span><h2 id="dialogTitle">'+title+'</h2><p>'+body+'</p><div class="actions">'+actions+'</div></section></div>';root.querySelector('button').focus()}
function saveNote(){let n=s.notes.find(n=>n.id===s.note);if(n)n.body=s.draft;else s.notes.push({id:s.note,name:'New note',body:s.draft});s.dirty=false}
function requestLeave(action,value){if(s.side==='notes'&&s.dirty){s.pending={action,value};s.modal='unsaved';return true}return false}
function dispatch(action,value){if(scenario==='availability'&&['notes','contents','open','node','train','reader','back'].includes(action)){s.message='This scenario demonstrates availability. Use the three navigation links to explore graph behavior.';document.getElementById('status').textContent=s.message;return}if(['note','newNote','closeNotes','open','node','contents','back','train','reader'].includes(action)&&requestLeave(action,value)){render();return}if(action==='node'){if(variant==='B'){s.peek=Number(value);s.message='Previewing '+byId(value).title+'. Text has not moved.'}else openNode(value)}else if(action==='open')openNode(value);else if(action==='done'){const id=Number(value);s.done.has(id)?s.done.delete(id):s.done.add(id);s.message='Completion updated in the reader and graph. The selected object stays open.'}else if(action==='back'){const prev=s.history.pop();if(prev){s.selected=prev;s.focus=prev;s.peek=prev;s.side='graph';s.message='Restored '+byId(prev).title}else s.message='This is the starting reading location.'}else if(action==='contents')s.side='contents';else if(action==='notes'){if(s.selected!==106){s.message='The attached-note example is on Integrability criterion. Open that object or use Note switching above.';document.getElementById('status').textContent=s.message;return}s.side='notes';s.selected=106;s.focus=106;s.peek=106;s.message='Notes for Integrability criterion.'}else if(action==='closeNotes'||action==='reader')s.side='graph';else if(action==='order')s.order=!s.order;else if(action==='goal'){s.goal=Number(value);s.message='Showing every dependency branch for '+byId(value).title+'. Your reading location has not changed.'}else if(action==='train'){const n=nodes.find(n=>n.id>s.selected&&n.type==='exercise'&&!s.done.has(n.id));if(n)openNode(n.id);else s.message='No unfinished exercise remains ahead.'}else if(action==='info')s.message=value;else if(action==='guide'){s.selected=106;s.focus=106;s.peek=106;s.side='graph';if(variant==='A')openNode(104);else if(variant==='B'){s.peek=104;s.message='Refinement lemma is selected for preview. Press Read this object to navigate.'}else{s.goal=109;s.message='The oscillating example needs the partitions and upper/lower sums branch. Continue route opens its first unfinished object.'}}else if(action==='case'){s.hidden.clear();s.modal=null;s.page='reader';s.base=value==='original'?'A':'C';s.selected=value==='original'?106:208;s.focus=s.selected;s.peek=s.selected;s.message='Base grimoire: '+names[s.base]+'. Original grimoire: Real Analysis.'}else if(action==='openAvailable'){s.page='reader';s.base='C';s.selected=208;s.focus=208;s.peek=208;s.message='Reopened the available base grimoire. The original remains unavailable.'}else if(action==='hide'){s.hidden.add('A');s.modal='unavailable';s.side='graph';s.message='Availability changed. Stored completion and positions are retained.'}else if(action==='exit'){s.modal=null;s.page='library';s.message='Exited the reader to My grimoires.'}else if(action==='stay'){s.modal=null;s.message='Stayed in '+names[s.base]+'. The unavailable origin and its saved position are retained.'}else if(action==='note'){s.note=Number(value);s.draft=s.notes.find(n=>n.id===s.note).body;s.dirty=false;s.message='Opened '+s.notes.find(n=>n.id===s.note).name+'.'}else if(action==='newNote'){s.note=Math.max(...s.notes.map(n=>n.id))+1;s.draft='';s.dirty=false;s.message='New attached note.'}else if(action==='saveNote'){saveNote();s.message='Your writing is saved in this tab.'}else if(action==='draft'){s.draft='My unsaved thought about the gap between sums.';s.dirty=true;s.side='notes';s.message='Unsaved example inserted. Try switching notes.'}else if(action==='resolveNote'){const pending=s.pending;s.modal=null;s.pending=null;if(value!=='cancel'){if(value==='save')saveNote();else{s.draft=s.notes.find(n=>n.id===s.note)?.body||'';s.dirty=false}dispatch(pending.action,pending.value);return}else s.message='Kept editing. Your unfinished writing remains.'}else if(action==='variant'){if(s.dirty){s.message='Save or finish editing your note before comparing graph variants.';document.getElementById('status').textContent=s.message;return}const variants=['A','B','C'];variant=variants[(variants.indexOf(variant)+(value==='next'?1:2))%3];changeVariant(variant);return}else if(action==='reset'){location.reload();return}render();if(action==='resolveNote'&&value==='cancel')document.getElementById('writing')?.focus()}
function changeVariant(v){variant=v;const p=new URLSearchParams(location.search);p.set('variant',v);history.replaceState(null,'','?'+p.toString());s.side='graph';s.focus=s.selected;s.peek=s.selected;s.message='Variant '+v+' · '+variantNames[v]+'. The same reading location and completion are retained.';render()}
document.addEventListener('click',e=>{const variantLink=e.target.closest('[data-variant]');if(variantLink){e.preventDefault();if(s.dirty){s.message='Save or finish editing your note before comparing graph variants.';document.getElementById('status').textContent=s.message;return}changeVariant(variantLink.dataset.variant);return}const el=e.target.closest('[data-action]');if(el)dispatch(el.dataset.action,el.dataset.value)});
document.addEventListener('change',e=>{if(e.target.id==='order')dispatch('order');else if(e.target.dataset.change)dispatch(e.target.dataset.change,e.target.value)});
document.addEventListener('input',e=>{if(e.target.id==='writing'){s.draft=e.target.value;s.dirty=s.draft!==(s.notes.find(n=>n.id===s.note)?.body||'');document.getElementById('dirty').textContent=s.dirty?'Unsaved changes':'Saved in this demo only'}});
document.addEventListener('keydown',e=>{if(s.modal){if(e.key==='Escape'&&s.modal==='unsaved'){e.preventDefault();dispatch('resolveNote','cancel')}if(e.key==='Tab'){const bs=[...document.querySelectorAll('#dialog button')],first=bs[0],last=bs.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}return}if(e.target.closest('input,textarea,select,[contenteditable]'))return;if((e.key==='Enter'||e.key===' ')&&e.target.matches('g[role=button]')){e.preventDefault();dispatch('node',e.target.dataset.value)}else if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();if(!s.dirty)dispatch('variant',e.key==='ArrowRight'?'next':'previous')}});
render();
</script></body></html>
