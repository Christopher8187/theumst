function pickNext(s){const pos=items.findIndex(x=>x.id===s.selected);let item=items.slice(pos+1).find(x=>x.type==="exercise"&&!s.done.includes(x.id));if(!item&&s.mode==="current")item=items.find(x=>x.type==="exercise"&&!s.done.includes(x.id))||items.find(x=>x.type==="exercise");return item||null;}

 let s=structuredClone(prev);const value=a.value;

 if(a.type==="mode"){const fresh=initial(s.q);fresh.mode=value;return fresh;}

 if(a.type==="endPolicy"){s.endPolicy=value;s.message=value==="wrap"?"Train may wrap to earlier unfinished exercises.":"Train will stop when no unfinished exercise remains ahead.";}
 if(a.type==="placeholder"){s.message=value+" is shown for familiarity; it is not part of this question.";}
 if(a.type==="train"){let next=pickNext(s);if(!next&&s.q==="q22"&&s.endPolicy==="wrap")next=items.find(x=>x.type==="exercise"&&!s.done.includes(x.id));if(!next){s.message="No unfinished exercise remains ahead. This empty-case wording is a proposal to discuss.";return s;}if(s.q==="q8"&&s.mode==="proposed"){s.right=next.id;s.side="exercise";s.message=getItem(s.selected).title+" stays left. "+next.title+" opens right.";}else{s.selected=next.id;s.shared=next.id;s.realm="questions";s.side="graph";s.message="Train selected "+next.title+" · object "+next.id+".";} }
 if(a.type==="closeSide"){s.right=null;s.side="graph";s.message="The right pane is back to the learning map.";}
 if(a.type==="doneRight"){const id=s.right;if(id){s.done=s.done.includes(id)?s.done.filter(n=>n!==id):s.done.concat(id);if(s.mode==="proposed")s.graphDone=s.done.slice();s.message=getItem(id).title+" completion changed; the original text is still selected.";}else s.message="Open an exercise with Train first.";}
 if(a.type==="toggleDone"){const id=Number(value);s.done=s.done.includes(id)?s.done.filter(n=>n!==id):s.done.concat(id);s.graphDone=s.done.slice();s.message="Changed completion for object "+id+".";}
 if(a.type==="finishLater"){const pos=items.findIndex(x=>x.id===s.selected);s.done=Array.from(new Set(s.done.concat(items.slice(pos+1).filter(x=>x.type==="exercise").map(x=>x.id))));s.graphDone=s.done.slice();s.message="All exercises after the selected object are complete.";}
 if(a.type==="done"){const id=s.selected,wasDone=s.done.includes(id);s.done=wasDone?s.done.filter(n=>n!==id):s.done.concat(id);if(s.mode==="proposed")s.graphDone=s.done.slice();if(!wasDone&&s.advance&&s.mode==="proposed"){const next=items[items.findIndex(x=>x.id===id)+1];if(next){s.selected=next.id;s.shared=next.id;s.remember[s.realm]=next.id;}}s.message=getItem(id).title+(wasDone?" is now unfinished.":" is now complete.")+" Selected item: "+getItem(s.selected).title+".";}
 if(a.type==="advance"){s.advance=value==="yes";s.message=s.advance?"The proposed action will advance after marking an item done.":"The proposed action will keep the item selected.";}
 if(a.type==="realm"){s.realm=value;if(s.mode==="current")s.selected=value==="questions"?8:s.shared;else s.selected=s.remember[value];s.message="Opened "+(value==="text"?"Text":"Questions")+" at "+getItem(s.selected).title+".";}
 if(a.type==="chooseNote"){const n=s.notes.find(n=>n.id===Number(value));if(n){s.noteId=n.id;s.noteTag=n.tag;s.noteBody=n.body;s.noteDraft=false;s.message="Editing the "+n.tag.toLowerCase()+" note.";} }
 if(a.type==="newNote"){s.noteId=null;s.noteTag="";s.noteBody="";s.noteDraft=false;s.message="New attached note for Theorem 4.2.";}
 if(a.type==="noteTag"){s.noteTag=value;s.noteDraft=true;}
 if(a.type==="noteBody"){s.noteBody=value;s.noteDraft=true;}
 if(a.type==="saveNote"){let n=s.notes.find(n=>n.id===s.noteId);if(n){n.tag=s.noteTag||"Untitled";n.body=s.noteBody;}else{n={id:Math.max(0,...s.notes.map(n=>n.id))+1,tag:s.noteTag||"Untitled",body:s.noteBody};s.notes.push(n);s.noteId=n.id;}s.noteDraft=false;s.message="Saved "+n.tag+" in this demo's memory.";}

 if(a.type==="notesRealm"){s.notePage=!s.notePage;s.message=s.notePage?"Notes realm: all attached notes remain available.":"Returned to the inline note editor.";}

 if(a.type==="toggleSection"){s.expanded=s.expanded.includes(value)?s.expanded.filter(id=>id!==value):s.expanded.concat(value);s.message=(s.expanded.includes(value)?"Expanded ":"Collapsed ")+value+".";}
 if(a.type==="deep"){s.path="deep";if(s.q==="q14")s.selected=73210;s.contentsOpen=false;s.message="Returned to subsection 7.3.2.1.";}
 if(a.type==="crumb"){if(s.mode==="current"){s.message="Current breadcrumbs are passive; they do not navigate.";return s;}s.path=value;if(s.q==="q14")s.selected=sectionItems[value].id;s.contentsOpen=false;s.message="Opened the first knowledge object of "+({chapter:"Chapter 7",section:"section 7.3",subsection:"subsection 7.3.2",deep:"subsection 7.3.2.1"}[value])+".";}
 if(a.type==="contents"){s.contentsOpen=!s.contentsOpen;s.message=s.contentsOpen?"Contents lets you reach ancestors outside the short path.":"Contents closed.";}
 if(a.type==="language"){s.lang=value;s.message="Interface language set to "+languages.find(l=>l[0]===value)[1]+". The book text remains English.";}
 if(a.type==="languageState"){s.langState=value;s.message="Showing the "+value+" interface state.";}
 if(a.type==="visit"){s.book=value;s.selected=value==="B"?10:15;s.realm=value==="B"?"text":"questions";s.message="Exploring Book "+value+". Original location remains Book "+s.origin.book+" · "+getItem(s.origin.selected).title+".";}
 if(a.type==="hideOrigin"){s.originHidden=!s.originHidden;s.returnNotice="";s.message=s.originHidden?"Book A is now unavailable; its saved position is retained.":"Book A is available again.";}
 if(a.type==="returnChecked"){if(s.originHidden){s.returnNotice="Your original book is currently unavailable. You are still in Book C. Your original position is saved.";s.message=s.returnNotice;}else{s.book=s.origin.book;s.selected=s.origin.selected;s.realm=s.origin.realm;s.returnNotice="";s.message="Returned to Book A · Theorem 4.2 · Text.";}}
 if(a.type==="returnOrigin"){s.book=s.origin.book;s.selected=s.origin.selected;s.realm=s.origin.realm;s.message="Returned to Book A · Theorem 4.2 · Text.";}
 return s;
}
const escapeText=x=>String(x).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function btn(label,action,value,cls,disabled){return '<button type="button" data-action="'+action+'"'+(value!==undefined&&value!==null?' data-value="'+escapeText(value)+'"':'')+' class="'+(cls||'')+'"'+(disabled?' disabled':'')+'>'+label+'</button>';}
function chip(text){return '<span class="badge">'+escapeText(text)+'</span>';}
function modeButtons(s){if(["q12","q19","q22","q23"].includes(s.q))return chip(agreedScenarios.has(s.q)?"Agreed direction · simulation":"Proposed interaction");const a=s.q==="q8"?"Rejected split proposal":s.q==="q16"?"Agreed · 3 languages":agreedScenarios.has(s.q)?"Agreed behavior":"Proposed behavior",b=s.q==="q16"?"Current · 7 languages":"Current code · simulated";return '<div class="segmented">'+['proposed','current'].map((m,i)=>'<button type="button" data-action="mode" data-value="'+m+'" aria-pressed="'+(s.mode===m)+'">'+(i?b:a)+'</button>').join('')+'</div>';}

function viewer(s,id,right,opts){const x=getItem(id),done=s.done.includes(x.id);return '<div class="panehead"><div><p class="kicker">'+(s.hidden?"Source unavailable":"Sample content · object "+(s.q==="q19"?s.book+"-":"")+x.id)+'</p><h2 class="reader-title">'+x.title+'</h2></div>'+chip(done?"Completed":"Not completed")+'</div><p class="kicker">Statement</p><p class="statement">'+x.text+'</p><div class="workings"><h3>Workings</h3><p>'+x.working+'</p></div>'+(opts===false?'':'<div class="actions">'+(right?btn(done?"Undo completion":"Mark exercise done","doneRight",null,"primary")+btn("Close exercise","closeSide"):btn(done?"Completed · undo":"Mark done","done",null,"primary")+(s.q==="q8"?btn("Train →","train"):''))+'</div>');}
function shellCanvas(s,content,label){return '<section class="canvas" aria-label="Interactive demo"><div class="canvasbar"><p>'+escapeText(label||"Real Analysis · Sample grimoire")+'</p>'+chip(s.q.toUpperCase()+" · "+(s.mode==="current"?"Current behavior simulation":"Proposal to discuss"))+'</div>'+content+'</section>';}

function visibleCount(nodes,expanded){return nodes.reduce((n,x)=>n+1+(expanded.includes(x.id)?visibleCount(x.children,expanded):0),0);}
function tree(nodes,s){return '<ul class="tree">'+nodes.map(x=>'<li>'+(x.children.length?'<button type="button" data-action="toggleSection" data-value="'+x.id+'" aria-expanded="'+s.expanded.includes(x.id)+'">'+(s.expanded.includes(x.id)?"▾ ":"▸ ")+escapeText(x.label)+'</button>':'<div class="leaf">'+escapeText(x.label)+'</div>')+(x.children.length&&s.expanded.includes(x.id)?tree(x.children,s):"")+'</li>').join('')+'</ul>';}
function allSections(nodes){return nodes.flatMap(x=>[x].concat(allSections(x.children)));}

function renderLanguages(s){const l=localeFor(s),available=s.mode==="current"?languages:languages.slice(0,3);return shellCanvas(s,'<div class="canvasbar"><div class="inline-control"><label for="langSelect">Interface language</label><select id="langSelect" data-select="language">'+available.map(x=>'<option value="'+x[0]+'"'+(s.lang===x[0]?' selected':'')+'>'+x[1]+'</option>').join('')+'</select></div>'+chip(available.length+" offered languages")+'</div><div class="wide-pane"><div class="segmented">'+btn(l.text,"languageState","normal")+btn(l.questions,"languageState","normal")+btn(l.notes,"languageState","normal")+'</div><div class="status-preview">'+(s.langState==="normal"?'<p class="kicker">'+l.statement+'</p><h3>Theorem 4.2</h3><p class="statement">Every bounded sequence of real numbers has a convergent subsequence.</p><div class="actions">'+btn(l.train,"languageState","loading")+btn(l.done,"languageState","normal")+'</div>':'<p class="kicker">'+l.graph+'</p><h3>'+l[s.langState]+'</h3>'+(s.langState==="error"?btn(l.retry,"languageState","loading"):""))+'</div><div class="policy"><span>Inspect a state:</span>'+["normal","loading","empty","error"].map(v=>btn(v[0].toUpperCase()+v.slice(1),"languageState",v,s.langState===v?"primary":"")).join('')+'</div><p class="muted" style="font-size:13px">'+(s.mode==="current"?"The current selector and selected untranslated strings are simulated from the code. The extra four dictionaries cover only some labels.":"Proposed three-language coverage. Translated sample labels are illustrative wording to review; book content is unchanged.")+'</p></div>');}
function renderOrigin(s){return shellCanvas(s,'<div class="canvasbar"><p>Original location: Book A · Theorem 4.2 · Text</p>'+btn("Return to original location","returnOrigin",null,"primary",s.book==="A")+'</div><div class="workspace"><article class="pane">'+viewer(s,s.selected,false,false)+'</article><aside class="pane"><p class="kicker">Visible example results</p><h2>Find neighbors</h2><div class="note-list">'+btn('<strong>Book B · Theorem 4.2</strong><small>Another presentation of subsequences.</small>',"visit","B","note-choice")+btn('<strong>Book C · Exercise 4.8</strong><small>Practice with a bounded sequence.</small>',"visit","C","note-choice")+'</div><div class="notice">The original location is stable while you follow another result. These links do not simulate a general search feature.</div></aside></div>',bookNames[s.book]);}
function facts(s){let pairs=[["Scenario",s.q.toUpperCase()],["Comparison",s.mode==="current"?"Current code, simulated":"Proposal"]];if(["q8","q9","q10","q11","q19","q22","q23"].includes(s.q))pairs=pairs.concat([["Selected",getItem(s.selected).title+" · "+s.selected],["Realm",s.realm==="text"?"Text":"Questions"],["Right pane",s.right?getItem(s.right).title:"Learning map"],["Completed objects",s.done.join(", ")||"None"]]);if(s.q==="q11")pairs=pairs.concat(s.mode==="current"?[["Shared saved position",getItem(s.shared).title]]:[["Text remembers",getItem(s.remember.text).title],["Questions remembers",getItem(s.remember.questions).title]]);if(s.q==="q12")pairs=pairs.concat([["Attached notes",s.notes.length],["Selected note",s.notes.find(n=>n.id===s.noteId)?.tag||"New note"],["Source access",s.hidden?"Unavailable":"Available"]]);if(s.q==="q13")pairs=pairs.concat([["Total sections",totalSections],["Rendered rows",s.mode==="current"?totalSections:visibleCount(sections,s.expanded)]]);if(s.q==="q14")pairs.push(["Current section",pathParts.find(x=>x[0]===s.path)[1]]);if(s.q==="q22")pairs.push(["No-exercise rule",s.endPolicy]);if(s.q==="q23")pairs.push(["Current book",s.book],["Original book available",s.originHidden?"No":"Yes"]);if(s.q==="q16")pairs=pairs.concat([["Language",languages.find(l=>l[0]===s.lang)[1]],["Book text","English, unchanged"],["Screen state",s.langState]]);if(s.q==="q19"){pairs=pairs.map(p=>p[0]==="Selected"?[p[0],getItem(s.selected).title+" · "+s.book+"-"+s.selected]:p[0]==="Right pane"?[p[0],"Neighborhood"]:p);pairs.push(["Current book",s.book],["Original book",s.origin.book]);}return '<dl class="state" aria-label="Current demo state">'+pairs.map(p=>'<div><dt>'+escapeText(p[0])+'</dt><dd>'+escapeText(p[1])+'</dd></div>').join('')+'</dl>';}

function familiarGraph(s){const graphItems=s.q==="q14"?Object.values(sectionItems):items;return '<div class="familiar-graph"><header><p>Learning map</p><h3>'+graphItems.length+' nearby ideas · '+(graphItems.length-1)+' sample links</h3></header><div class="familiar-legend"><span>Learning sequence</span><span>Main idea</span><span>Practice</span></div><div class="familiar-node-list">'+graphItems.map(x=>btn('<small>'+(x.type==="exercise"?"Practice":"Main idea")+'</small><strong>'+x.title+'</strong><small>'+x.type+(s.done.includes(x.id)?" · completed":"")+'</small>',(s.q==="q12"||s.q==="q14")?"placeholder":"pick",(s.q==="q12"||s.q==="q14")?"Graph navigation":x.id,"familiar-node"+(s.selected===x.id?" active":"")+(s.done.includes(x.id)?" done":""))).join('')+'</div></div>';}
function familiarNoteEditor(s,inline){const title=s.hidden?"Your personal writing":"Knowledge #"+s.selected;return '<div class="familiar-note"><header><div><p>'+title+'</p><h3>Notes</h3></div>'+(inline?btn("×","closeNotes",null,"",false):'')+'</header>'+(inline?'<div class="familiar-note-picker"><label class="note-label">Attached note<select id="attachedSelect" data-select="chooseNote">'+(s.noteId===null?'<option selected value="">New note</option>':'')+s.notes.map(n=>'<option value="'+n.id+'"'+(s.noteId===n.id?' selected':'')+'>'+escapeText(n.tag)+'</option>').join('')+'</select></label>'+btn("+ New note","newNote")+'</div>':'')+'<label class="note-label">Tag<input data-field="noteTag" value="'+escapeText(s.noteTag)+'"></label><label class="note-label">Your writing<textarea data-field="noteBody">'+escapeText(s.noteBody)+'</textarea></label><small id="draftStatus">'+(s.noteDraft?"Unsaved changes":"Saved in this demo only")+'</small><div class="actions">'+(inline?btn("✎ All notes","notesRealm"):btn("← Back to Text","closeNotes"))+btn("Save note","saveNote",null,"primary")+'</div><p class="source-state">'+(s.hidden?"Source unavailable · Your writing is retained.":"Real Analysis · Theorem 4.2")+'</p></div>';}
function familiarCrumbs(s){const all=pathParts.slice(0,pathParts.findIndex(x=>x[0]===s.path)+1),shown=s.mode==="current"?all:all.slice(-3);return '<div class="breadcrumbs" aria-label="Reader section path">'+shown.map((p,i)=>(i?'<span>›</span>':'')+(s.mode==="current"?'<span class="plain">'+p[1]+'</span>':btn(p[1],"crumb",p[0]))).join('')+'</div>';}
function familiarReaderBody(s){if(s.hidden)return '<div class="familiar-empty"><h3>Source unavailable</h3><p>The book cannot be read while hidden. Your personal writing remains available in Notes.</p></div>';const item=getItem(s.selected);return '<div class="familiar-meta">'+chip(item.type)+'<span>#'+item.id+'</span><span>'+item.title+'</span><strong>'+(s.realm==="questions"?"?":"▥")+'</strong></div><section class="familiar-section"><header><h3>Statement</h3>'+btn("▶ Listen","placeholder","Listen")+'</header><p>'+item.text+'</p></section><section class="familiar-section"><header><h3>Workings</h3>'+btn("✦ Prompt","placeholder","Prompt")+'</header><p>'+item.working+'</p></section><div class="familiar-actions">'+btn("↗ Project","placeholder","Project")+btn("✎ Notes",s.q==="q12"?"openNotes":"placeholder",s.q==="q12"?null:"Notes",s.side==="notes"?"active":"")+btn("✦ Find neighbors","placeholder","Find neighbors")+btn(s.realm==="questions"?"▥ Book":"→ Train",s.realm==="questions"?"readerHome":s.q==="q22"?"train":"placeholder",s.q==="q22"?null:"Train")+'</div>';}
function familiarContents(s){return '<div class="familiar-contents"><div class="panehead"><h3>Contents</h3>'+btn("×","contents")+'</div><p class="muted">Select a section to open its first object.</p>'+pathParts.map(p=>btn(p[1],"crumb",p[0])).join('')+'</div>';}
function familiarShell(s,body){return '<section class="familiar-app" aria-label="Familiar Text reader"><aside class="familiar-rail">'+btn("← Back","readerHome")+'<strong>UMST</strong><span></span></aside><div class="familiar-main"><div class="familiar-utility"><a href="#q16">Language: English</a><span>Web Demo Version 0.0.1 · sample</span></div><div class="familiar-topbar"><div><p>'+(s.notePage?"Notes realm":s.realm==="questions"?"Questions realm":"Text realm")+'</p><h2>'+(s.hidden?"Unavailable source":s.q==="q23"?bookNames[s.book]:"Real Analysis")+'</h2></div>'+(s.hidden?"":s.q==="q14"?familiarCrumbs(s)+(s.mode==="current"?'':btn("Contents","contents")):'<span class="muted" style="font-size:12px">4 · Sequences › 4.2 · Subsequences</span>')+'</div>'+body+'</div></section>';}
function familiarReader(s){let right=s.q==="q12"&&s.side==="notes"?familiarNoteEditor(s,true):s.q==="q14"&&s.contentsOpen?familiarContents(s):s.hidden?'<div class="familiar-empty"><h3>Source unavailable</h3></div>':familiarGraph(s);return familiarShell(s,'<div class="familiar-split"><div class="familiar-left">'+familiarReaderBody(s)+'</div><aside class="familiar-right">'+right+'<div class="familiar-completion">'+btn(s.done.includes(s.selected)?"✓ Completed":"○ Mark done","done",null,s.done.includes(s.selected)?"primary":"",s.hidden)+(s.q==="q23"?btn("← Return to original book","returnChecked",null,"",s.book==="A"):"")+'</div>'+(s.q==="q23"&&s.returnNotice?'<div class="notice" role="alert">'+escapeText(s.returnNotice)+'</div>':"")+'</aside></div>');}
function familiarNotes(s){if(!s.notePage)return familiarReader(s);return familiarShell(s,'<div class="familiar-all-notes">'+familiarNoteEditor(s,false)+'<div class="familiar-all-list"><p class="kicker">Personal knowledge layer</p><h3>Attached notes · '+s.notes.length+'</h3>'+s.notes.map(n=>btn('<strong>'+escapeText(n.tag)+'</strong><small>'+escapeText(n.body)+'</small>',"chooseNote",n.id,"note-choice"+(s.noteId===n.id?" active":""))).join('')+btn(s.hidden?"Make source available":"Hide the source book","hideSource",null,"ghost")+'</div></div>');}
function renderHiddenOrigin(s){return '<div class="familiar-policy"><span>'+(s.originHidden?"Original location: unavailable book · position retained":"Original location: Book A · Theorem 4.2 · Text")+'</span>'+btn(s.originHidden?"Make Book A available":"Make Book A unavailable","hideOrigin")+'</div>'+familiarReader(s);}
function renderEnd(s){return '<div class="familiar-policy"><span>When nothing unfinished remains ahead:</span>'+btn("Stop here","endPolicy","stop",s.endPolicy==="stop"?"primary":"")+btn("Wrap to earlier exercises","endPolicy","wrap",s.endPolicy==="wrap"?"primary":"")+'</div>'+familiarReader(s);}

const states={};let route="";
function currentRoute(){const q=location.hash.slice(1).toLowerCase();return meta[q]?q:"q8";}
function render(){
 route=currentRoute();if(!states[route])states[route]=initial(route);const s=states[route],m=meta[route];
 document.title=route.toUpperCase()+" · "+m.short+" · Theumst demo";
 document.getElementById("nav").innerHTML=order.map(q=>'<a href="#'+q+'" class="'+(q===route?"active":"")+'"'+(q===route?' aria-current="page"':'')+'><span>'+q.toUpperCase()+'</span>'+meta[q].short+'</a>').join('');
 let scene=route==="q8"||route==="q10"?renderReader(s):route==="q9"?renderSelection(s):route==="q11"?renderPositions(s):route==="q12"?familiarNotes(s):route==="q13"?renderContents(s):route==="q14"?familiarReader(s):route==="q16"?renderLanguages(s):route==="q22"?renderEnd(s):route==="q23"?renderHiddenOrigin(s):renderOrigin(s);
 const step=m.guide[s.step];
 document.getElementById("main").innerHTML='<header><p class="eyebrow">'+route.toUpperCase()+' / functional sketch / sample data</p><h1>'+m.title+'</h1><p class="intro">'+m.intro+'</p>'+(route==="q14"?'<div class="notice"><strong>Q14 has moved to three new navigation prototypes.</strong> Compare <a href="navigation-systems.html?variant=A">A · Atlas</a>, <a href="navigation-systems.html?variant=B">B · Focus</a>, and <a href="navigation-systems.html?variant=C">C · Destination</a>. The older section-only sketch below is retained as history.</div>':route==="q23"?'<div class="notice"><strong>This earlier Q23 proposal is superseded.</strong> <a href="navigation-systems.html?variant=A&scenario=availability">Open the agreed notification flow</a>: confirm and exit, with an extra Stay option when a different base grimoire is available.</div>':route==="q12"?'<div class="notice">Q12 accepted. <a href="navigation-systems.html?variant=A&scenario=notes">Try the newly ready unsaved-note switching question</a>.</div>':route==="q22"?'<div class="notice">Q22 accepted: stop when no unfinished exercise remains ahead. The wrap comparison below is historical.</div>':'')+'<div class="question-box"><p>'+m.question+'</p></div></header><div class="tools">'+modeButtons(s)+btn("Reset this scenario","reset",null,"ghost")+'</div>'+scene+(route==="q14"?'<div class="familiar-demo-controls">'+btn("Restore starting Text location","readerHome")+'</div>':'')+'<div class="notice" role="status" aria-live="polite">'+escapeText(s.message)+'</div><section class="guide"><div><h2>Guided walkthrough'+(s.guided?" · "+Math.min(s.step+1,m.guide.length)+" of "+m.guide.length:"")+'</h2><p>'+(s.guided?(step?"Next action: "+step[2]:"Complete. Try the free-play controls or reset to compare another behavior."):"Start from a known state, then press each action in order.")+'</p></div><div class="guide-actions">'+btn(s.guided?"Restart walkthrough":"Start walkthrough","startGuide")+ (s.guided?btn(step?step[2]:"Walkthrough complete","nextGuide",null,"primary",!step):"")+'</div></section>'+facts(s)+'<div class="footerline">Local prototype. No accounts, source books, APIs, or stored user data are accessed. '+(route==="q8"?"The split-pane proposal was rejected.":agreedScenarios.has(route)?"This scenario illustrates an agreed direction; implementation is tracked separately.":"This proposal is awaiting your decision.")+' <a href="#q12">Open the notes question</a></div>';
}
document.addEventListener("click",e=>{const target=e.target.closest("button[data-action]");if(!target||target.disabled)return;states[route]=reduce(states[route],{type:target.dataset.action,value:target.dataset.value});render();});
document.addEventListener("change",e=>{if(e.target.dataset.select){states[route]=reduce(states[route],{type:e.target.dataset.select,value:e.target.value});render();}});
document.addEventListener("input",e=>{if(e.target.dataset.field){states[route]=reduce(states[route],{type:e.target.dataset.field,value:e.target.value});const status=document.getElementById("draftStatus");if(status)status.textContent="Unsaved changes";}});
window.addEventListener("hashchange",()=>{render();window.scrollTo(0,0);});
render();
</script>
</body>
