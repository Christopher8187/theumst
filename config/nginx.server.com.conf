server {
    listen 80 default_server;
    server_name theumst.com www.theumst.com;

    root /var/www/theumst.com;

    location ^~ /.well-known/acme-challenge/ {
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name theumst.com www.theumst.com;

    ssl_certificate /etc/letsencrypt/live/theumst-com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/theumst-com/privkey.pem;

    client_max_body_size 50m;

    # The application authenticates this exact route with a master API key and
    # streams the archive from disk. All other public routes retain 50m.
    location = /api/v1/books/ingest-archive {
        client_max_body_size 1g;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 1800s;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 120s;
    }
}
