server {
    listen 80;
    server_name _;
    client_max_body_size 50m;

    location = /_demo_auth {
        internal;
        proxy_pass http://backend:8000/api/demo/auth-check;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Original-URI $request_uri;
    }

    location /demo/ {
        auth_request /_demo_auth;
        error_page 401 403 = @demo_gate;
        proxy_pass http://demo:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location @demo_gate {
        absolute_redirect off;
        return 303 /dashboard/demo/;
    }

    # Whole-book ingestion is master-key protected by FastAPI. Keep the
    # ordinary public request limit below, while allowing large book bundles
    # on this exact streaming route.
    location = /api/v1/books/ingest-archive {
        client_max_body_size 1g;
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1800s;
    }

    # A game note holds up to 50,000 characters, as a Web Demo note does, which
    # can pass 128 KiB as UTF-8 or JSON escapes. The backend checks the limits.
    location ~ ^/api/game/grimoires/[0-9]+/notes(/[0-9]+)?$ {
        client_max_body_size 1m;
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The game's account and character calls carry at most a 64 KiB save and
    # a 2 KiB summary; refuse larger bodies before the backend reads them.
    location /api/game/ {
        client_max_body_size 128k;
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
